name: Nexus Core issue completion

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  nexus-core-issue-completion:
    name: Nexus Core issue completion
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
      UV_PROJECT_ENVIRONMENT: /tmp/nexus-core-project-venv
      UV_TOOL_DIR: /tmp/nexus-core-tools
      UV_TOOL_BIN_DIR: /tmp/nexus-core-bin
      UV_NO_SYNC: "1"
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch exact base ref
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Resolve exact Issue binding
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          body = os.environ.get("PR_BODY", "")
          matches = re.findall(r"<!--\s*NEXUS_CORE_ISSUE:\s*([1-9][0-9]*)\s*-->", body)
          if len(matches) != 1:
              raise SystemExit(
                  "NEXUS_CORE_ISSUE_BINDING_REQUIRED: PR body must contain exactly one "
                  "'<!-- NEXUS_CORE_ISSUE: <number> -->' marker."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"number={matches[0]}\n")
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.1

      - name: Set up Python
        run: uv python install 3.11

      - name: Install pinned nexus-certify outside candidate tree
        run: |
          set -euo pipefail
          mkdir -p "$UV_TOOL_BIN_DIR"
          uv tool install --force "git+https://github.com/James3014/nexus-core.git@5d7350d0a4b2ef4a899198efb1ce5b9f947405ed"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Bootstrap repository dependencies outside candidate tree
        run: |
          set -euo pipefail
          uv sync --locked --no-install-project

      - name: Bind exact Issue contract
        run: |
          set -euo pipefail
          nexus-certify issue-init --repo . --issue "${{ steps.issue.outputs.number }}"

      - name: Verify exact Issue-bound candidate
        run: |
          set -euo pipefail
          nexus-certify issue-check --repo . --issue "${{ steps.issue.outputs.number }}"
