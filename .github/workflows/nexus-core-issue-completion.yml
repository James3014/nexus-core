name: Nexus Core issue completion

# Trusted-input model
# - The workflow file itself comes from the BASE ref by pull_request_target
#   semantics; the Core governance config comes from the base ref by Core
#   construction (check/issue-check read .nexus-core/config.toml from the
#   base_ref commit and --require-trusted-config fails closed otherwise).
# - A PR that changes the gate or config is verified under generation N and
#   takes effect as generation N+1 after an ordinary reviewed merge. No manual
#   bypass and no byte-compare "protect inputs" step is needed.
# - The runner never executes candidate code: the tool is installed from the
#   trusted base checkout, and the verifier runs inside the configured
#   container isolation (see .nexus-core/config.toml).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: nexus-core-issue-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nexus-core-issue-completion:
    name: Nexus Core issue completion
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout trusted base (gate action and tool source only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Issue gate
        uses: ./trusted/.github/actions/issue-gate
        with:
          nexus-certify-source: path
          nexus-certify-path: ${{ github.workspace }}/trusted
