name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.1
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run Architecture Prohibition Gate
        run: uv run pytest -q tests/architecture
      - name: Run Product Tests
        run: uv run pytest -q tests/product
      - name: Run Core-V1 Benchmark Tests
        run: uv run pytest -q tests/benchmark
      - name: Run Ruff
        run: uv run ruff check product tests
      - name: Run Pyright
        run: uv run pyright product
      - name: Build Wheel and SDist
        run: uv build
      - name: Verify License Included in Distribution Artifacts
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("dist/nexus_certify-*.whl")
          sdist = glob.glob("dist/nexus_certify-*.tar.gz")
          assert len(wheel) == 1, wheel
          assert len(sdist) == 1, sdist

          with zipfile.ZipFile(wheel[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names), names

          with tarfile.open(sdist[0], "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/LICENSE") for name in names), names
          PY
      - name: Clean Environment Wheel Install Smoke
        run: |
          python -m venv .smoke_venv
          .smoke_venv/bin/pip install dist/nexus_certify-*.whl
          .smoke_venv/bin/nexus-certify --help
