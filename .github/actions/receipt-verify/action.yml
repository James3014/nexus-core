name: Nexus Core receipt verify
description: >-
  Consumes the receipt and Sigstore bundle produced by the issue-gate action.
  Verifies the keyless signature against the expected GitHub workflow identity,
  then runs nexus-certify receipt-check with every expectation (VERIFIED status,
  exact PR head, exact head tree, base-ref config commit, Issue binding, clean
  subject, trusted config). Any failure is a non-zero exit. The artifact is resolved
  to exactly one artifact of this workflow run uploaded by the producing attempt;
  missing, ambiguous or mismatched identity fails closed. The calling job needs
  only 'contents: read' and 'actions: read'; it never checks out candidate code.

inputs:
  artifact-name:
    description: >-
      Name of the artifact uploaded by issue-gate (output 'artifact-name'). Must be
      nexus-core-receipts-<head-sha>-run<run-id>-attempt<n> for this head, this
      workflow run and an attempt not after the current one; head-only names are
      rejected because rerun attempts share them.
    required: true
  artifact-id:
    description: >-
      Optional artifact id uploaded by issue-gate (output 'artifact-id'). When set,
      the artifact resolved by name must have exactly this id.
    required: false
    default: ""
  expected-identity:
    description: >-
      Full Sigstore certificate identity of the signing workflow, e.g.
      https://github.com/OWNER/REPO/.github/workflows/<file>.yml@refs/heads/main
    required: true
  github-repository:
    description: "'owner/name' of the repository that must have produced the signature."
    required: true
  head-sha:
    description: 40-hex pull request head commit the receipt must describe.
    required: true
  base-sha:
    description: 40-hex base commit whose config the receipt must have used.
    required: true
  issue-number:
    description: Positive Issue number the receipt must be bound to.
    required: true
  nexus-certify-source:
    description: "'ref' installs from a pinned nexus-core commit; 'path' installs from a trusted local checkout."
    required: false
    default: ref
  nexus-certify-ref:
    description: "40-hex nexus-core commit sha to install from (required when nexus-certify-source is 'ref')."
    required: false
    default: ""
  nexus-certify-path:
    description: "Trusted local source directory (used when nexus-certify-source is 'path')."
    required: false
    default: ""
  python-version:
    description: Python version installed by uv.
    required: false
    default: "3.11"
  sigstore-version:
    description: Exact sigstore release used for verification.
    required: false
    default: "4.5.0"

outputs:
  artifact-id:
    description: Id of the exact producer artifact that was resolved and downloaded.
    value: ${{ steps.artifact.outputs.artifact-id }}
  receipt-sha256:
    description: SHA-256 of the verified receipt.
    value: ${{ steps.verify.outputs.receipt-sha256 }}
  verified:
    description: "'true' only when signature and every receipt-check expectation passed."
    value: ${{ steps.verify.outputs.verified }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        IN_ARTIFACT: ${{ inputs.artifact-name }}
        IN_ARTIFACT_ID: ${{ inputs.artifact-id }}
        IN_IDENTITY: ${{ inputs.expected-identity }}
        IN_REPO: ${{ inputs.github-repository }}
        IN_HEAD: ${{ inputs.head-sha }}
        IN_BASE: ${{ inputs.base-sha }}
        IN_ISSUE: ${{ inputs.issue-number }}
        IN_SOURCE: ${{ inputs.nexus-certify-source }}
        IN_REF: ${{ inputs.nexus-certify-ref }}
        IN_PATH: ${{ inputs.nexus-certify-path }}
        IN_PYTHON: ${{ inputs.python-version }}
        IN_SIGSTORE: ${{ inputs.sigstore-version }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        fail() { echo "NEXUS_CORE_VERIFY_INPUT_INVALID: $1" >&2; exit 1; }
        [[ "$IN_ARTIFACT" =~ ^[A-Za-z0-9_.-]+$ ]] || fail "artifact-name"
        [ -z "$IN_ARTIFACT_ID" ] || [[ "$IN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || fail "artifact-id must be a positive integer"
        [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || fail "github.run_id"
        [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]] || fail "github.run_attempt"
        [[ "$IN_IDENTITY" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_./-]+@refs/[A-Za-z0-9_./-]+$ ]] || fail "expected-identity"
        [[ "$IN_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "github-repository must be owner/name"
        [[ "$IN_HEAD" =~ ^[0-9a-f]{40}$ ]] || fail "head-sha must be 40-hex"
        [[ "$IN_BASE" =~ ^[0-9a-f]{40}$ ]] || fail "base-sha must be 40-hex"
        [[ "$IN_ISSUE" =~ ^[1-9][0-9]*$ ]] || fail "issue-number must be a positive integer"
        [[ "$IN_PYTHON" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || fail "python-version"
        [[ "$IN_SIGSTORE" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || fail "sigstore-version must be an exact release"
        case "$IN_SOURCE" in
          ref) [[ "$IN_REF" =~ ^[0-9a-f]{40}$ ]] || fail "nexus-certify-ref must be 40-hex" ;;
          path) [ -n "$IN_PATH" ] || fail "nexus-certify-path must be set" ;;
          *) fail "nexus-certify-source must be 'ref' or 'path'" ;;
        esac
        # Bind the producing attempt: this head, this workflow run, attempt <= current.
        # A verifier-only rerun keeps the producer's (earlier) attempt from needs outputs.
        prefix="nexus-core-receipts-${IN_HEAD}-run${RUN_ID}-attempt"
        producer_attempt="${IN_ARTIFACT#"$prefix"}"
        if [ "$producer_attempt" = "$IN_ARTIFACT" ] \
          || ! [[ "$producer_attempt" =~ ^[1-9][0-9]{0,5}$ ]] \
          || [ "$producer_attempt" -gt "$RUN_ATTEMPT" ]; then
          echo "NEXUS_CORE_VERIFY_ARTIFACT_IDENTITY_INVALID: artifact-name must be ${prefix}<n> with n <= ${RUN_ATTEMPT}" >&2
          exit 1
        fi

    - name: Resolve exact producer artifact
      id: artifact
      shell: bash
      env:
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import sys
        import urllib.parse
        import urllib.request

        name = os.environ["ARTIFACT_NAME"]
        run_id = int(os.environ["RUN_ID"])
        expected_id = os.environ.get("ARTIFACT_ID", "")


        def fail(code, detail):
            sys.stderr.write(f"{code}: {detail}\n")
            raise SystemExit(1)


        query = urllib.parse.urlencode({"name": name, "per_page": 100})
        url = f"{os.environ['API_URL']}/repos/{os.environ['REPO']}/actions/runs/{run_id}/artifacts?{query}"
        request = urllib.request.Request(
            url,
            headers={
                "Accept": "application/vnd.github+json",
                "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                "X-GitHub-Api-Version": "2022-11-28",
            },
        )
        try:
            with urllib.request.urlopen(request, timeout=60) as response:
                payload = json.load(response)
        except Exception as error:  # noqa: BLE001 - any lookup failure is fail-closed
            fail("NEXUS_CORE_VERIFY_ARTIFACT_LOOKUP_FAILED", type(error).__name__)

        artifacts = payload.get("artifacts") if isinstance(payload, dict) else None
        total = payload.get("total_count") if isinstance(payload, dict) else None
        if (
            not isinstance(artifacts, list)
            or type(total) is not int
            or total != len(artifacts)
            or not all(isinstance(item, dict) for item in artifacts)
        ):
            fail("NEXUS_CORE_VERIFY_ARTIFACT_LOOKUP_FAILED", "malformed or truncated artifact listing")
        if any(item.get("name") != name for item in artifacts):
            fail("NEXUS_CORE_VERIFY_ARTIFACT_LOOKUP_FAILED", "listing contains another artifact name")
        if not artifacts:
            fail("NEXUS_CORE_VERIFY_ARTIFACT_MISSING", f"no artifact {name} in workflow run {run_id}")
        if len(artifacts) != 1:
            ids = sorted(str(item.get("id")) for item in artifacts)
            fail("NEXUS_CORE_VERIFY_ARTIFACT_AMBIGUOUS", f"{len(artifacts)} artifacts named {name}: {ids}")
        artifact = artifacts[0]
        artifact_id = artifact.get("id")
        workflow_run = artifact.get("workflow_run")
        if type(artifact_id) is not int or artifact_id <= 0:
            fail("NEXUS_CORE_VERIFY_ARTIFACT_LOOKUP_FAILED", "artifact id is not a positive integer")
        if not isinstance(workflow_run, dict) or type(workflow_run.get("id")) is not int or workflow_run["id"] != run_id:
            fail("NEXUS_CORE_VERIFY_ARTIFACT_LOOKUP_FAILED", "artifact does not belong to this workflow run")
        if artifact.get("expired") is not False:
            fail("NEXUS_CORE_VERIFY_ARTIFACT_EXPIRED", f"artifact {artifact_id} is expired or unknown")
        if expected_id and str(artifact_id) != expected_id:
            fail("NEXUS_CORE_VERIFY_ARTIFACT_ID_MISMATCH", f"expected {expected_id}, resolved {artifact_id}")
        print(f"NEXUS_CORE_VERIFY_ARTIFACT: {name} id={artifact_id}")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"artifact-name={name}\nartifact-id={artifact_id}\n")
        PY

    - name: Set up uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.1

    - name: Install pinned nexus-certify
      shell: bash
      env:
        IN_SOURCE: ${{ inputs.nexus-certify-source }}
        IN_REF: ${{ inputs.nexus-certify-ref }}
        IN_PATH: ${{ inputs.nexus-certify-path }}
        IN_PYTHON: ${{ inputs.python-version }}
        UV_TOOL_DIR: ${{ runner.temp }}/nexus-core-tools
        UV_TOOL_BIN_DIR: ${{ runner.temp }}/nexus-core-bin
      run: |
        set -euo pipefail
        uv python install "$IN_PYTHON"
        mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR"
        if [ "$IN_SOURCE" = "ref" ]; then
          uv tool install --force --python "$IN_PYTHON" "git+https://github.com/James3014/nexus-core.git@${IN_REF}"
        else
          uv tool install --force --python "$IN_PYTHON" "$IN_PATH"
        fi
        "$UV_TOOL_BIN_DIR/nexus-certify" --help >/dev/null
        echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

    - name: Download receipt artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        # Unique within this run: resolved above to exactly one producer artifact.
        name: ${{ steps.artifact.outputs.artifact-name }}
        path: ${{ runner.temp }}/nexus-core-receipt-artifact

    - name: Locate exactly one receipt and bundle
      id: locate
      shell: bash
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/nexus-core-receipt-artifact
      run: |
        set -euo pipefail
        mapfile -t bundles < <(find "$ARTIFACT_DIR" -type f -name '*.sigstore.json' | sort)
        mapfile -t receipts < <(find "$ARTIFACT_DIR" -type f -name '*.json' ! -name '*.sigstore.json' | sort)
        if [ "${#bundles[@]}" -ne 1 ] || [ "${#receipts[@]}" -ne 1 ]; then
          echo "NEXUS_CORE_VERIFY_ARTIFACT_INVALID: expected exactly one receipt and one bundle, found ${#receipts[@]} receipt(s) and ${#bundles[@]} bundle(s)" >&2
          exit 1
        fi
        if [ "${bundles[0]}" != "${receipts[0]}.sigstore.json" ]; then
          echo "NEXUS_CORE_VERIFY_ARTIFACT_INVALID: bundle does not belong to receipt" >&2
          exit 1
        fi
        {
          echo "receipt=${receipts[0]}"
          echo "bundle=${bundles[0]}"
        } >> "$GITHUB_OUTPUT"

    - name: Verify Sigstore signature and workflow identity
      shell: bash
      env:
        RECEIPT: ${{ steps.locate.outputs.receipt }}
        BUNDLE: ${{ steps.locate.outputs.bundle }}
        IDENTITY: ${{ inputs.expected-identity }}
        REPO: ${{ inputs.github-repository }}
        SIGSTORE_VERSION: ${{ inputs.sigstore-version }}
      run: |
        set -euo pipefail
        uvx --from "sigstore==${SIGSTORE_VERSION}" sigstore verify github \
          --cert-identity "$IDENTITY" \
          --repository "$REPO" \
          --bundle "$BUNDLE" \
          "$RECEIPT"

    - name: Resolve expected head tree
      id: tree
      shell: bash
      env:
        REPO: ${{ inputs.github-repository }}
        SERVER: ${{ github.server_url }}
        HEAD_SHA: ${{ inputs.head-sha }}
        WORK: ${{ runner.temp }}/nexus-core-head-tree
        FETCH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        rm -rf "$WORK"
        git init -q "$WORK"
        # Token on the command line only (never persisted); works for private repositories.
        basic_auth="$(printf '%s' "x-access-token:$FETCH_TOKEN" | base64 | tr -d '\n')"
        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="Authorization: basic $basic_auth" \
          git -C "$WORK" fetch -q --no-tags --depth 1 "$SERVER/${REPO}.git" "$HEAD_SHA"
        tree="$(git -C "$WORK" rev-parse 'FETCH_HEAD^{tree}')"
        [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || { echo "NEXUS_CORE_VERIFY_TREE_UNRESOLVED" >&2; exit 1; }
        echo "tree=$tree" >> "$GITHUB_OUTPUT"

    - name: Check receipt against every expectation
      id: verify
      shell: bash
      env:
        RECEIPT: ${{ steps.locate.outputs.receipt }}
        TREE: ${{ steps.tree.outputs.tree }}
        REPO: ${{ inputs.github-repository }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        ISSUE: ${{ inputs.issue-number }}
      run: |
        set -euo pipefail
        echo "verified=false" >> "$GITHUB_OUTPUT"
        nexus-certify receipt-check --receipt "$RECEIPT" \
          --expect-status VERIFIED \
          --expect-subject-head "$HEAD_SHA" \
          --expect-target-tree "$TREE" \
          --expect-config-commit "$BASE_SHA" \
          --expect-issue "$ISSUE" \
          --expect-github-repository "$REPO" \
          --require-clean-subject \
          --require-trusted-config
        echo "receipt-sha256=$(sha256sum "$RECEIPT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        echo "verified=true" >> "$GITHUB_OUTPUT"
