name: Nexus Core issue gate
description: >-
  Two-stage pull-request gate. Installs a pinned nexus-certify before any
  candidate code exists on the runner, then runs issue-init and issue-check
  --require-trusted-config against the candidate. Candidate code is never
  executed on the runner; the verifier runs inside the configured isolation.
  The newest receipt (success or failure) is signed with Sigstore keyless
  signing and uploaded with its bundle. The CALLER JOB MUST GRANT
  'id-token: write' (plus contents/issues/pull-requests: read) or signing fails.
  Two modes, chosen by the event: pull_request / pull_request_target (head and
  base from the pull request), and repository_dispatch on the default branch
  (dispatch mode: explicit head-sha and issue-number inputs; the base is the
  run's own commit github.sha, the default-branch tip). Any other event, or a
  dispatch that is not on the default branch, fails closed.

inputs:
  issue-number:
    description: >-
      Issue number. When empty, exactly one '<!-- NEXUS_CORE_ISSUE: N -->'
      marker is parsed from the pull request body (fail closed otherwise).
      Required in dispatch mode.
    required: false
    default: ""
  head-sha:
    description: >-
      40-hex candidate head. Pull request events: empty or exactly the pull
      request head sha. Dispatch mode (repository_dispatch): required.
    required: false
    default: ""
  nexus-certify-source:
    description: "'ref' installs from a pinned nexus-core commit; 'path' installs from a trusted local checkout."
    required: false
    default: ref
  nexus-certify-ref:
    description: "40-hex nexus-core commit sha to install from (required when nexus-certify-source is 'ref')."
    required: false
    default: ""
  nexus-certify-path:
    description: "Trusted local source directory (used when nexus-certify-source is 'path'; must NOT be the candidate)."
    required: false
    default: ""
  evidence-universe:
    description: >-
      'issue-marker' (default, fail closed) requires the Issue body to carry the
      NEXUS_CORE_EVIDENCE_UNIVERSE marker. 'trusted-config' derives the evidence universe
      from the trusted base config (no Issue marker; gives up the agent re-acknowledgement step).
    required: false
    default: issue-marker
  python-version:
    description: Python version installed by uv.
    required: false
    default: "3.11"
  candidate-path:
    description: Directory the candidate head is checked out into.
    required: false
    default: candidate

outputs:
  outcome:
    description: >-
      'PROCEED' when the live PR was open and the Issue-bound check ran, or the neutral
      'PR_ALREADY_CLOSED_SKIPPED' when the PR had already merged or closed before this
      run started (no candidate evaluated, no receipt, never VERIFIED). receipt-verify
      re-reads the live PR and accepts the skip only for a merge at this exact head.
    value: ${{ steps.prstate.outputs.outcome }}
  issue-number:
    description: Resolved Issue number.
    value: ${{ steps.resolve.outputs.issue-number }}
  head-sha:
    description: Resolved 40-hex candidate head the receipt describes.
    value: ${{ steps.target.outputs.head-sha }}
  base-sha:
    description: Resolved 40-hex base commit whose config the check used.
    value: ${{ steps.target.outputs.base-sha }}
  artifact-name:
    description: >-
      Name of the uploaded artifact holding the receipt and its Sigstore bundle:
      nexus-core-receipts-<head-sha>-run<run-id>-attempt<run-attempt>, unique to
      this producing attempt (earlier attempts' artifacts are retained on rerun).
    value: ${{ steps.names.outputs.artifact-name }}
  artifact-id:
    description: GitHub artifact id of the uploaded receipt artifact (empty when the upload did not run).
    value: ${{ steps.upload.outputs.artifact-id }}
  receipt-file:
    description: Path of the signed receipt (empty when no receipt was produced).
    value: ${{ steps.sign.outputs.receipt-file }}
  bundle-file:
    description: Path of the Sigstore bundle for the receipt (empty when not signed).
    value: ${{ steps.sign.outputs.bundle-file }}
  receipt-sha256:
    description: SHA-256 of the signed receipt (empty when no receipt).
    value: ${{ steps.sign.outputs.receipt-sha256 }}

runs:
  using: composite
  steps:
    - name: Resolve gate target (head, base, base ref)
      id: target
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        IN_HEAD: ${{ inputs.head-sha }}
        IN_ISSUE: ${{ inputs.issue-number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        RUN_SHA: ${{ github.sha }}
        RUN_REF: ${{ github.ref }}
        RUN_REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        # The only dispatch trigger accepted (single constant; audited by tests).
        readonly DISPATCH_EVENT="repository_dispatch"
        fail() { echo "NEXUS_CORE_GATE_TARGET_INVALID: $1" >&2; exit 1; }
        case "$EVENT_NAME" in
          pull_request|pull_request_target)
            if [ -n "$IN_HEAD" ] && [ "$IN_HEAD" != "$PR_HEAD_SHA" ]; then
              fail "head-sha input must be empty or equal the pull request head sha"
            fi
            head="$PR_HEAD_SHA"
            base="$PR_BASE_SHA"
            mode="pull_request"
            base_ref="$PR_BASE_REF"
            ;;
          "$DISPATCH_EVENT")
            [[ "$IN_HEAD" =~ ^[0-9a-f]{40}$ ]] || fail "dispatch mode requires a 40-hex head-sha"
            [[ "$IN_ISSUE" =~ ^[1-9][0-9]*$ ]] || fail "dispatch mode requires a positive issue-number"
            [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9_./-]+$ ]] || fail "default branch unresolved"
            # Trusted config comes from the run's own commit, which must be the
            # default-branch tip that this dispatch ran on.
            [ "$RUN_REF" = "refs/heads/${DEFAULT_BRANCH}" ] || fail "dispatch must run on refs/heads/${DEFAULT_BRANCH}, got ${RUN_REF}"
            [ "$RUN_REF_NAME" = "$DEFAULT_BRANCH" ] || fail "ref_name must be the default branch"
            head="$IN_HEAD"
            base="$RUN_SHA"
            base_ref="$RUN_REF_NAME"
            mode="dispatch"
            ;;
          *)
            fail "unsupported event '${EVENT_NAME}'"
            ;;
        esac
        [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "NEXUS_CORE_GATE_HEAD_SHA_INVALID" >&2; exit 1; }
        [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "NEXUS_CORE_GATE_BASE_SHA_INVALID" >&2; exit 1; }
        [[ "$base_ref" =~ ^[A-Za-z0-9_./-]+$ ]] && [[ "$base_ref" != *..* ]] || { echo "NEXUS_CORE_GATE_BASE_REF_INVALID" >&2; exit 1; }
        {
          echo "head-sha=$head"
          echo "base-sha=$base"
          echo "base-ref=$base_ref"
          echo "mode=$mode"
        } >> "$GITHUB_OUTPUT"

    - name: Validate inputs and resolve Issue binding
      id: resolve
      shell: bash
      env:
        IN_ISSUE: ${{ inputs.issue-number }}
        IN_SOURCE: ${{ inputs.nexus-certify-source }}
        IN_REF: ${{ inputs.nexus-certify-ref }}
        IN_PATH: ${{ inputs.nexus-certify-path }}
        IN_CANDIDATE: ${{ inputs.candidate-path }}
        IN_PYTHON: ${{ inputs.python-version }}
        PR_BODY: ${{ github.event.pull_request.body || '' }}
      run: |
        set -euo pipefail
        case "$IN_SOURCE" in
          ref)
            if ! [[ "$IN_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "NEXUS_CORE_GATE_REF_INVALID: nexus-certify-ref must be a 40-hex commit sha" >&2
              exit 1
            fi
            ;;
          path)
            if [ -z "$IN_PATH" ] || [ "$IN_PATH" = "$IN_CANDIDATE" ]; then
              echo "NEXUS_CORE_GATE_PATH_INVALID: nexus-certify-path must be set and differ from candidate-path" >&2
              exit 1
            fi
            ;;
          *)
            echo "NEXUS_CORE_GATE_SOURCE_INVALID: nexus-certify-source must be 'ref' or 'path'" >&2
            exit 1
            ;;
        esac
        if ! [[ "$IN_CANDIDATE" =~ ^[A-Za-z0-9_-][A-Za-z0-9_./-]*$ ]] || [[ "$IN_CANDIDATE" == *..* ]]; then
          echo "NEXUS_CORE_GATE_CANDIDATE_PATH_INVALID" >&2
          exit 1
        fi
        if ! [[ "$IN_PYTHON" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
          echo "NEXUS_CORE_GATE_PYTHON_VERSION_INVALID" >&2
          exit 1
        fi
        if [ -n "$IN_ISSUE" ]; then
          if ! [[ "$IN_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "NEXUS_CORE_ISSUE_BINDING_REQUIRED: issue-number must be a positive integer" >&2
            exit 1
          fi
          number="$IN_ISSUE"
        else
          number="$(python3 - <<'PY'
        import os
        import re
        import sys

        body = os.environ.get("PR_BODY", "")
        matches = re.findall(r"<!--\s*NEXUS_CORE_ISSUE:\s*([1-9][0-9]*)\s*-->", body)
        if len(matches) != 1:
            sys.stderr.write(
                "NEXUS_CORE_ISSUE_BINDING_REQUIRED: PR body must contain exactly one "
                "'<!-- NEXUS_CORE_ISSUE: <number> -->' marker.\n"
            )
            remedy = (
                "PR_MISSING_CORE_ISSUE_BINDING: add exactly one line "
                "<!-- NEXUS_CORE_ISSUE: N --> (N = the Issue number) to the PR body, "
                f"then re-run the gate (found {len(matches)})"
            )
            sys.stderr.write(remedy + "\n")
            summary = os.environ.get("GITHUB_STEP_SUMMARY")
            if summary:
                with open(summary, "a", encoding="utf-8") as handle:
                    handle.write(
                        "### Nexus Core gate: how to fix\n\n```text\n" + remedy + "\n```\n\n"
                    )
            raise SystemExit(1)
        print(matches[0])
        PY
        )"
        fi
        echo "issue-number=$number" >> "$GITHUB_OUTPUT"

    - name: Set up uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.1

    - name: Install pinned nexus-certify (before any candidate code exists)
      shell: bash
      env:
        IN_SOURCE: ${{ inputs.nexus-certify-source }}
        IN_REF: ${{ inputs.nexus-certify-ref }}
        IN_PATH: ${{ inputs.nexus-certify-path }}
        IN_PYTHON: ${{ inputs.python-version }}
        UV_TOOL_DIR: ${{ runner.temp }}/nexus-core-tools
        UV_TOOL_BIN_DIR: ${{ runner.temp }}/nexus-core-bin
      run: |
        set -euo pipefail
        uv python install "$IN_PYTHON"
        mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR"
        if [ "$IN_SOURCE" = "ref" ]; then
          uv tool install --force --python "$IN_PYTHON" "git+https://github.com/James3014/nexus-core.git@${IN_REF}"
        else
          uv tool install --force --python "$IN_PYTHON" "$IN_PATH"
        fi
        "$UV_TOOL_BIN_DIR/nexus-certify" --help >/dev/null
        echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

    - name: Read live pull request state
      id: prstate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ steps.target.outputs.head-sha }}
        TARGET_MODE: ${{ steps.target.outputs.mode }}
      run: |
        set -euo pipefail
        # Dispatch mode has no pull request; the dispatched head is checked as a
        # branch tip in the candidate fetch instead.
        if [ "$TARGET_MODE" = "dispatch" ]; then
          echo "NEXUS_CORE_PR_STATE: dispatch mode, no pull request"
          echo "outcome=PROCEED" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        [ "$TARGET_MODE" = "pull_request" ] || { echo "NEXUS_CORE_GATE_TARGET_MODE_INVALID" >&2; exit 1; }
        # A queued or retried run can start after the PR merged and auto-closed its
        # Issue. Read the live PR (never the Issue): an open PR proceeds unchanged; a
        # merged or closed PR gets the neutral PR_ALREADY_CLOSED_SKIPPED record, which
        # evaluates nothing and is never VERIFIED. API failure fails closed.
        [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "NEXUS_CORE_GATE_PR_NUMBER_INVALID" >&2; exit 1; }
        record="$(nexus-certify pr-state --mode gate --github-repo "$REPO" --pr "$PR_NUMBER" --expect-head "$HEAD_SHA")"
        outcome="$(printf '%s' "$record" | python3 -c 'import json, sys; print(json.load(sys.stdin)["outcome"])')"
        case "$outcome" in
          PROCEED|PR_ALREADY_CLOSED_SKIPPED) ;;
          *) echo "NEXUS_CORE_GATE_PR_STATE_INVALID: $outcome" >&2; exit 1 ;;
        esac
        echo "NEXUS_CORE_PR_STATE: $record"
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        if [ "$outcome" = "PR_ALREADY_CLOSED_SKIPPED" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          printf '### Nexus Core gate: PR_ALREADY_CLOSED_SKIPPED (neutral, not a pass)\n\nThe pull request was already merged or closed when this run started, so no candidate was evaluated and no receipt was produced. receipt-verify accepts this only when the live PR is merged at this exact head.\n\n```json\n%s\n```\n' "$record" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Acquire candidate head with plain Git (no submodule handling)
      if: steps.prstate.outputs.outcome == 'PROCEED'
      shell: bash
      env:
        CANDIDATE: ${{ inputs.candidate-path }}
        REPO: ${{ github.repository }}
        SERVER: ${{ github.server_url }}
        HEAD_SHA: ${{ steps.target.outputs.head-sha }}
        BASE_SHA: ${{ steps.target.outputs.base-sha }}
        BASE_REF: ${{ steps.target.outputs.base-ref }}
        TARGET_MODE: ${{ steps.target.outputs.mode }}
        FETCH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "NEXUS_CORE_GATE_HEAD_SHA_INVALID" >&2; exit 1; }
        [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "NEXUS_CORE_GATE_BASE_SHA_INVALID" >&2; exit 1; }
        [[ "$BASE_REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "NEXUS_CORE_GATE_BASE_REF_INVALID" >&2; exit 1; }
        rm -rf "$CANDIDATE"
        git init -q "$CANDIDATE"
        git -C "$CANDIDATE" remote add origin "$SERVER/$REPO.git"
        # The token is passed on the command line only; nothing is written to .git/config,
        # so no credential survives in the candidate tree (same guarantee as
        # actions/checkout persist-credentials: false). Full history is fetched so the
        # base ref resolves as an ancestor; '+' forces the base ref so a moved base does
        # not reject a non-fast-forward. Submodules/gitlinks are never initialised.
        basic_auth="$(printf '%s' "x-access-token:$FETCH_TOKEN" | base64 | tr -d '\n')"
        if [ "$TARGET_MODE" = "dispatch" ]; then
          # Dispatch mode: the head must be the tip of a branch of this repository.
          # A commit reachable only via refs/pull/* (e.g. a fork pull request head) is
          # refused, so dispatch never runs code the fork guard keeps off this runner.
          heads="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="Authorization: basic $basic_auth" \
            git -C "$CANDIDATE" ls-remote --heads origin)"
          if ! printf '%s\n' "$heads" | awk -v sha="$HEAD_SHA" '$1 == sha && $2 ~ /^refs\/heads\// { found = 1 } END { exit !found }'; then
            echo "NEXUS_CORE_GATE_DISPATCH_HEAD_NOT_A_BRANCH_TIP: $HEAD_SHA is not the tip of any branch of $REPO" >&2
            exit 1
          fi
        fi
        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="Authorization: basic $basic_auth" \
          git -C "$CANDIDATE" fetch --no-tags origin \
            "+${HEAD_SHA}:refs/remotes/origin/nexus-core-candidate" \
            "+${BASE_SHA}:refs/remotes/origin/${BASE_REF}"
        git -C "$CANDIDATE" checkout -q --detach "$HEAD_SHA"
        test "$(git -C "$CANDIDATE" rev-parse HEAD)" = "$HEAD_SHA"
        test "$(git -C "$CANDIDATE" rev-parse "refs/remotes/origin/${BASE_REF}")" = "$BASE_SHA"
        test -z "$(git -C "$CANDIDATE" config --get http.extraheader || true)"

    - name: Bind exact Issue contract
      if: steps.prstate.outputs.outcome == 'PROCEED'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CANDIDATE: ${{ inputs.candidate-path }}
        ISSUE: ${{ steps.resolve.outputs.issue-number }}
        EVIDENCE_UNIVERSE: ${{ inputs.evidence-universe }}
      run: |
        set -euo pipefail
        nexus-certify issue-init --repo "$CANDIDATE" --issue "$ISSUE" --evidence-universe "$EVIDENCE_UNIVERSE"

    - name: Verify exact Issue-bound candidate
      if: steps.prstate.outputs.outcome == 'PROCEED'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CANDIDATE: ${{ inputs.candidate-path }}
        ISSUE: ${{ steps.resolve.outputs.issue-number }}
        EVIDENCE_UNIVERSE: ${{ inputs.evidence-universe }}
      run: |
        set -euo pipefail
        nexus-certify issue-check --repo "$CANDIDATE" --issue "$ISSUE" --evidence-universe "$EVIDENCE_UNIVERSE" --require-trusted-config

    - name: Sign newest receipt (Sigstore keyless)
      id: sign
      if: always() && steps.prstate.outputs.outcome != 'PR_ALREADY_CLOSED_SKIPPED'
      shell: bash
      env:
        CANDIDATE: ${{ inputs.candidate-path }}
        SIGSTORE_VERSION: "4.5.0"
      run: |
        set -euo pipefail
        receipt="$(python3 - <<'PY'
        import os
        import re
        from datetime import datetime
        from pathlib import Path

        pattern = re.compile(r"^(\d{8}T\d{6}\.\d{6})\+0000-[0-9a-f]{12}\.json$")
        directory = Path(os.environ["CANDIDATE"]) / ".nexus-core" / "receipts"
        candidates = []
        if directory.is_dir():
            for path in directory.iterdir():
                match = pattern.match(path.name)
                if match and path.is_file() and not path.is_symlink():
                    stamp = datetime.strptime(match.group(1), "%Y%m%dT%H%M%S.%f")
                    candidates.append((stamp, path.name, path))
        if candidates:
            print(max(candidates)[2])
        PY
        )"
        if [ -z "$receipt" ]; then
          echo "NEXUS_CORE_SIGN: no receipt"
          exit 0
        fi
        bundle="${receipt}.sigstore.json"
        uvx --from "sigstore==${SIGSTORE_VERSION}" sigstore sign --bundle "$bundle" "$receipt"
        sha="$(sha256sum "$receipt" | cut -d' ' -f1)"
        echo "NEXUS_CORE_SIGN: signed $receipt sha256=$sha"
        {
          echo "receipt-file=$receipt"
          echo "bundle-file=$bundle"
          echo "receipt-sha256=$sha"
        } >> "$GITHUB_OUTPUT"

    - name: Publish Core receipt summary
      if: always() && steps.sign.outputs.receipt-file != '' && steps.prstate.outputs.outcome != 'PR_ALREADY_CLOSED_SKIPPED'
      continue-on-error: true
      shell: bash
      env:
        RECEIPT: ${{ steps.sign.outputs.receipt-file }}
        RECEIPT_SHA256: ${{ steps.sign.outputs.receipt-sha256 }}
      run: |
        # Display only (#273): never changes the verdict or any output.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          nexus-certify receipt-summary --receipt "$RECEIPT" --receipt-sha256 "$RECEIPT_SHA256" --gate-verdict unverified >> "$GITHUB_STEP_SUMMARY"
        fi
        nexus-certify receipt-summary --receipt "$RECEIPT" --gate-verdict unverified --format notice

    - name: Name receipt artifact
      id: names
      if: always()
      shell: bash
      env:
        HEAD_SHA: ${{ steps.target.outputs.head-sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        # A rerun keeps earlier attempts' artifacts in the same workflow run, so the
        # name binds the exact head, run and attempt that produced this receipt.
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "NEXUS_CORE_GATE_HEAD_SHA_INVALID" >&2; exit 1; }
        [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "NEXUS_CORE_GATE_RUN_ID_INVALID" >&2; exit 1; }
        [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]] || { echo "NEXUS_CORE_GATE_RUN_ATTEMPT_INVALID" >&2; exit 1; }
        echo "artifact-name=nexus-core-receipts-${HEAD_SHA}-run${RUN_ID}-attempt${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

    - name: Upload receipts
      id: upload
      if: always() && steps.names.outcome == 'success' && steps.prstate.outputs.outcome != 'PR_ALREADY_CLOSED_SKIPPED'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: ${{ steps.names.outputs.artifact-name }}
        path: ${{ inputs.candidate-path }}/.nexus-core/receipts/
        if-no-files-found: warn
        retention-days: 30

    - name: Diagnose Core verifier failure
      if: failure()
      shell: bash
      env:
        CANDIDATE: ${{ inputs.candidate-path }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import re
        from datetime import datetime
        from pathlib import Path

        pattern = re.compile(r"^(\d{8}T\d{6}\.\d{6})\+0000-[0-9a-f]{12}\.json$")
        directory = Path(os.environ["CANDIDATE"]) / ".nexus-core" / "receipts"
        candidates = []
        if directory.is_dir():
            for path in directory.iterdir():
                match = pattern.match(path.name)
                if match and path.is_file() and not path.is_symlink():
                    stamp = datetime.strptime(match.group(1), "%Y%m%dT%H%M%S.%f")
                    candidates.append((stamp, path.name, path))
        if not candidates:
            print("NEXUS_CORE_DIAGNOSTIC: no receipt available")
            raise SystemExit(0)
        path = max(candidates)[2]
        payload = json.loads(path.read_text(encoding="utf-8"))
        verifier = payload.get("verifier") or {}
        artifacts = payload.get("evidence_artifacts") or []
        outcome = payload.get("outcome") or {}
        print("NEXUS_CORE_DIAGNOSTIC_RECEIPT:", path.name)
        print("status:", outcome.get("status") or payload.get("status"))
        print("reason_codes:", outcome.get("reason_codes") or payload.get("reason_codes"))
        print("config_source:", payload.get("config_source"))
        if verifier:
            print("verifier_command:", verifier.get("command"))
            print("verifier_exit_code:", verifier.get("exit_code"))
            print("--- verifier stdout ---")
            print(verifier.get("stdout", ""))
            print("--- verifier stderr ---")
            print(verifier.get("stderr", ""))
        for artifact in artifacts:
            print("--- evidence artifact ---")
            print("producer_id:", artifact.get("producer_id"))
            print("kind:", artifact.get("producer_kind"))
            print("status:", artifact.get("status"))
            print("expected_identity:", artifact.get("expected_identity"))
            print("observed_identity:", artifact.get("observed_identity"))
            print("exit_code:", artifact.get("exit_code"))
            print(artifact.get("stdout", ""))
            print(artifact.get("stderr", ""))
        PY
