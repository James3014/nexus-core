name: Nexus Core issue completion

# Minimal consumer workflow for the Nexus Core issue gate.
# Requires container isolation ([isolation] mode = "container") in the
# repository's committed .nexus-core/config.toml. See
# docs/GITHUB_REPOSITORY_CHECK.md.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: nexus-core-issue-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nexus-core-issue-completion:
    name: Nexus Core issue completion
    # Same-repository branches only; fork PRs are intentionally excluded.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pin to a full 40-hex commit sha of James3014/nexus-core, and use the
      # same sha for nexus-certify-ref.
      - uses: James3014/nexus-core/.github/actions/issue-gate@0000000000000000000000000000000000000000
        with:
          nexus-certify-ref: "0000000000000000000000000000000000000000"
