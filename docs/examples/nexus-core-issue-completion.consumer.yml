name: Nexus Core issue completion

# Two-job consumer workflow with the repository_dispatch early run (Issue #255).
# Copy to .github/workflows/nexus-core-issue-completion.yml.
# This file lives under docs/examples so it never runs in nexus-core itself.
#
# - repository_dispatch (type 'nexus-core-precheck', client_payload
#   {"head_sha": "<40-hex>", "issue_number": <N>}) runs the heavy check early on
#   the default branch; the head must be the tip of a branch of this repository.
#   Sending it needs only 'contents: write'.
# - On a pull request, 'run' does the full check.
# - 'verify' is the required check: it passes only on a receipt-verify that
#   succeeded with verified == 'true', or (pull requests only) on receipt-verify's
#   confirmed PR_ALREADY_CLOSED_SKIPPED.
# - 'verify' must never be skipped: GitHub treats a skipped required check as
#   passed, so a job-level source condition would let fork or cross-repository PRs
#   merge unchecked (#265). It keeps only `if: always()`; its first step fails
#   closed with NEXUS_CORE_UNTRUSTED_PR_SOURCE (head repository differs from this
#   repository; never test head.repo.fork), NEXUS_CORE_UNTRUSTED_EVENT or
#   NEXUS_CORE_UNTRUSTED_DISPATCH_REF, then NEXUS_CORE_ISSUER_NOT_SUCCESSFUL when
#   the run job did not succeed (the run job may be skipped for the same sources).
# Requires container isolation ([isolation] mode = "container") in the
# repository's committed .nexus-core/config.toml. See
# docs/GITHUB_REPOSITORY_CHECK.md.
#
# Adapt: replace OWNER/REPO in expected-identity; keep the file name (or change
# expected-identity to the new name); replace every 0000...0000 placeholder with
# the same full 40-hex commit sha of James3014/nexus-core (pin; never a
# tag/branch).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  repository_dispatch:
    types: [nexus-core-precheck]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: nexus-core-issue-completion-${{ github.event.pull_request.number || format('precheck-{0}', github.event.client_payload.head_sha) }}
  cancel-in-progress: true

jobs:
  run:
    name: Nexus Core issue run
    # Same-repository branches only. Do not add `head.repo.fork == false`: when the
    # repository is itself a fork, that clause is true for every branch and skips the gate.
    # Dispatch: on the default branch only (issue-gate re-asserts the ref).
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'repository_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write   # required for Sigstore keyless signing
    outputs:
      artifact-name: ${{ steps.gate.outputs.artifact-name }}
      artifact-id: ${{ steps.gate.outputs.artifact-id }}
      issue-number: ${{ steps.gate.outputs.issue-number }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      outcome: ${{ steps.gate.outputs.outcome }}
    steps:
      - name: Issue gate
        id: gate
        uses: James3014/nexus-core/.github/actions/issue-gate@0000000000000000000000000000000000000000  # pin: same sha
        with:
          head-sha: ${{ github.event.client_payload.head_sha }}
          issue-number: ${{ github.event.client_payload.issue_number }}
          nexus-certify-ref: "0000000000000000000000000000000000000000"  # same sha

  verify:
    name: Nexus Core issue completion   # the required status check
    needs: run
    # Never put a source condition here: a job skipped by `if:` reports as skipped, and
    # GitHub treats a skipped required check as passed. The guard step below fails closed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read   # receipt-verify re-reads the live PR for PR_ALREADY_CLOSED_SKIPPED
    steps:
      - name: Fail closed on untrusted source or unsuccessful issuer
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target)
              if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$REPOSITORY" ]; then
                echo "NEXUS_CORE_UNTRUSTED_PR_SOURCE: head repository '${HEAD_REPO:-}' is not '$REPOSITORY'" >&2
                exit 1
              fi
              ;;
            repository_dispatch)
              if [ -z "$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "NEXUS_CORE_UNTRUSTED_DISPATCH_REF: '$REF' is not the default branch" >&2
                exit 1
              fi
              ;;
            *)
              echo "NEXUS_CORE_UNTRUSTED_EVENT: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ "$RUN_RESULT" != "success" ]; then
            echo "NEXUS_CORE_ISSUER_NOT_SUCCESSFUL: run job result is '$RUN_RESULT'" >&2
            exit 1
          fi

      - name: Verify signed receipt
        id: verify
        uses: James3014/nexus-core/.github/actions/receipt-verify@0000000000000000000000000000000000000000  # pin: same sha
        with:
          artifact-name: ${{ needs.run.outputs.artifact-name }}
          artifact-id: ${{ needs.run.outputs.artifact-id }}
          # This very workflow file, on the default branch.
          expected-identity: https://github.com/OWNER/REPO/.github/workflows/nexus-core-issue-completion.yml@refs/heads/main
          github-repository: ${{ github.repository }}
          head-sha: ${{ github.event.pull_request.head.sha || needs.run.outputs.head-sha }}
          base-sha: ${{ github.event.pull_request.base.sha || github.sha }}
          issue-number: ${{ needs.run.outputs.issue-number }}
          gate-outcome: ${{ needs.run.outputs.outcome }}
          nexus-certify-ref: "0000000000000000000000000000000000000000"  # same sha

      - name: Decide required check
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
          VERIFY_RESULT: ${{ steps.verify.outputs.outcome }}
        run: |
          set -euo pipefail
          # Pass only on (a) a receipt-verify step that succeeded with verified == 'true'.
          if [ "$VERIFY_OUTCOME" = "success" ] && [ "$VERIFIED" = "true" ]; then
            echo "NEXUS_CORE_GATE: PASS via verified receipt from this run"
            exit 0
          fi
          # (b) Pull requests only: receipt-verify confirmed the live PR was merged at this
          # exact head before the gate ran (#250 neutral skip, not completion evidence).
          # Dispatch has no pull request, so a skip there never passes.
          if [ "$EVENT_NAME" = "pull_request_target" ] && [ "$VERIFY_OUTCOME" = "success" ] && [ "$VERIFY_RESULT" = "PR_ALREADY_CLOSED_SKIPPED" ]; then
            echo "NEXUS_CORE_GATE: NEUTRAL PR_ALREADY_CLOSED_SKIPPED (merged at this head before the gate ran)"
            exit 0
          fi
          echo "NEXUS_CORE_GATE: FAIL (verify=${VERIFY_OUTCOME}/${VERIFIED:-}/${VERIFY_RESULT:-})" >&2
          exit 1
