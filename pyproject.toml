[project]
name = "nexus-core"
version = "0.1.0"
description = "Nexus Evidence Trust Core and Completion Core"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "aiohttp>=3.9.0",
    "PyGithub>=2.1.0",
]

[project.scripts]
nexus-certify = "product.clients.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.15",
    "pyright>=1.1.370",
    "httpx>=0.25.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["product*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "I", "E"]
ignore = ["E501"]
fixable = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["product"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

# Legacy package metadata compatibility fixture:
# packages = [{include = "product"}]
# version = "28.3.0"

[tool.pyright]
include = ["product"]
typeCheckingMode = "basic"

